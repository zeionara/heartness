services:
  opencode:
    image: zeio.ru/heartness:opencode-$OPENCODE_VERSION
    container_name: opencode
    restart: unless-stopped
    volumes:
      - ./opencode.jsonc:/home/zeio/.config/opencode/opencode.jsonc
      - ./opencode-mem.jsonc:/home/zeio/.config/opencode/opencode-mem.jsonc
      - ./AGENTS.md:/home/zeio/.config/opencode/AGENTS.md
      - ../agents:/home/zeio/.config/opencode/agents
      - ../commands:/home/zeio/.config/opencode/commands
      - ../skills:/home/zeio/.config/opencode/skills
      - ../plugins:/home/zeio/.config/opencode/plugins
      - $HOME/.local/state/opencode:/home/zeio/.local/state/opencode
      - $HOME/.local/share/opencode:/home/zeio/.local/share/opencode
      - $HOME/.config/opencode:/home/zeio/.config/opencode
      - $HOME/.cache/opencode:/home/zeio/.cache/opencode
      - $HOME/.cache/huggingface/hub:/home/zeio/.cache/huggingface/hub
      - $HOME/.opencode-mem:/home/zeio/.opencode-mem
      # projects
      - /opt/agent-ui:/opt/agent-ui
      - /opt/pd_control:/opt/pd_control
      - /opt/settings/claude/claude-config:/opt/claude-config
      - /home/zeio/.oh-my-zsh/custom/shell/agents.zsh:/home/zeio/agents.zsh
      - /opt/lumin:/opt/lumin
      - $HOME/.cache/opencode-venv/lumin:/opt/lumin/.venv
      - /opt/villm:/opt/villm
      - $HOME/.cache/opencode-venv/villm:/opt/villm/.venv
      - /opt/agent:/opt/agent
      - $HOME/.cache/opencode-venv/agent:/opt/agent/.venv
      - /opt/cheekup:/opt/cheekup
      - $HOME/.cache/opencode-venv/cheekup:/opt/cheekup/.venv
      - /opt/lux:/opt/lux
      - $HOME/.cache/opencode-venv/lux:/opt/lux/.venv
    ports:
      - 4747:4747  # opencode-mem UI
    env_file:
      - ../.env
      - .env
    deploy:
     resources:
       reservations:
         devices:
           - driver: nvidia
             count: all
             capabilities:
               - gpu
    # network_mode: host  # only one opencode container can be running on a host if network_mode is set to host
